name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build PricePin.sln -c Release

      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test tests/PricePin.Core.Tests -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish src/PricePin/PricePin.csproj -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PricePin-${{ matrix.rid }}
          path: publish/PricePin.exe
          if-no-files-found: error

      # Builds the real installer the same way the release workflow does, so packaging
      # problems show up on the pull request and the installer can be tried before a release.
      - name: Build installer (test)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $version = "$version-ci.${{ github.run_number }}"
          dotnet tool install -g vpk --version 1.2.161
          dotnet publish src/PricePin/PricePin.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:Version=$version -p:DebugType=none -o publish-installer
          vpk pack -u PricePin -v $version -p publish-installer -e PricePin.exe -r ${{ matrix.rid }} --channel ${{ matrix.rid }} `
            -i src/PricePin/Assets/PricePin.ico --packTitle PricePin --packAuthors "PricePin contributors" -o releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem releases

      - uses: actions/upload-artifact@v4
        with:
          name: PricePin-${{ matrix.rid }}-Setup
          path: releases/*-Setup.exe
          if-no-files-found: error

  feed-probe:
    # Connects to the real exchanges from a Windows runner and prints what arrived.
    # Informational only: GitHub's runners are in the US, where Binance.com is blocked,
    # so this also shows the automatic failover doing its job.
    name: Live feed probe
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Probe feeds
        run: dotnet run --project tools/FeedProbe -c Release -- 15 BTC ETH SOL SUI

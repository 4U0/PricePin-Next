    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 150) rotate(90) scale(235 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D399" stop-opacity=".1"/>
      <stop offset="1" stop-color="#22D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x=".5" y=".5" width="1199" height="359" rx="24" fill="url(#background)" stroke="#283447"/>
  <rect x="620" y="1" width="579" height="358" rx="24" fill="url(#glow)"/>
  <g stroke="#94A3B8" stroke-opacity=".09">
    <path d="M696 80H1136M696 130H1136M696 180H1136M696 230H1136M696 280H1136"/>
    <path d="M736 60V300M816 60V300M896 60V300M976 60V300M1056 60V300M1136 60V300"/>

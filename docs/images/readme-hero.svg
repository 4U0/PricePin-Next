<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PricePin — Your market, always in view</title>
  <desc id="desc">A dark navy banner with mint green lettering and an abstract price line ending in a pin.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151E2D"/>
      <stop offset="1" stop-color="#0B1019"/>
    </linearGradient>
    <linearGradient id="area" x1="900" y1="104" x2="900" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D399" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="680" y1="260" x2="1100" y2="130" gradientUnits="userSpaceOnUse">

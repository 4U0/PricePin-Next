    <circle cx="74" cy="64" r="4" fill="#22D399"/>
    <text x="88" y="69" fill="#79EAC5" font-size="12" font-weight="600" letter-spacing="1.8">YOUR DESKTOP. LIVE.</text>
    <text x="52" y="158" fill="#F1F5F9" font-size="66" font-weight="700" letter-spacing="-2">Price<tspan fill="#22D399">Pin</tspan></text>
    <text x="56" y="207" fill="#F1F5F9" font-size="25" font-weight="500">Your market, always in view.</text>
    <text x="56" y="243" fill="#94A3B8" font-size="18">Live crypto prices. Right on your desktop.</text>
